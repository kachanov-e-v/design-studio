name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vite 7 requires Node >= 20.19 / >= 22.12
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (coverage with per-area line thresholds)
        run: npm run test:coverage

      - name: Build (incl. verify-build smoke)
        run: npm run build

      - name: Audit (fail on high/critical)
        run: npm audit --audit-level=high

      # Advisory: moderate findings are tracked but must not block CI; the
      # hard gate above is set to high.
      - name: Audit moderate findings (advisory)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Package extension
        if: matrix.node == 22
        run: npx --yes @vscode/vsce@latest package --no-dependencies

      - name: Upload VSIX artifact
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: design-studio-vsix
          path: "*.vsix"
          if-no-files-found: error
