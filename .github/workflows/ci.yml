name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # jsdom 31 requires Node ^22.22.2 || ^24.15.0 || >=26 (undici 8 needs
        # node:zlib createZstdDecompress); vite 7 requires >= 20.19 / >= 22.12
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (coverage with per-area line thresholds)
        run: npm run test:coverage

      - name: Build (incl. verify-build smoke)
        run: npm run build

      # Hard gate on shipped code only: the extension has zero runtime
      # dependencies (VSIX is packaged --no-dependencies). Dev-chain advisories
      # (picomatch/fdir ReDoS etc.) currently have no patched upstream releases;
      # npm audit's only "fixes" are major toolchain downgrades. They are
      # tracked by the advisory full-audit step below and by dependabot.
      - name: Audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      # Advisory: full-tree findings (incl. dev-only) are tracked but must not
      # block CI; the hard gate above covers runtime dependencies.
      - name: Audit full tree (advisory)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Package extension
        if: matrix.node == 22
        run: npx --yes @vscode/vsce@latest package --no-dependencies

      - name: Upload VSIX artifact
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: design-studio-vsix
          path: "*.vsix"
          if-no-files-found: error
